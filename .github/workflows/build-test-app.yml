# Manually triggered EAS cloud build of the native app for testing on real
# phones. Needs the EXPO_TOKEN repository secret (expo.dev → Access tokens).
# See docs/native-camera-device-tests.md for installing the builds.
name: Build test app
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile (apps/mobile/eas.json)
        type: choice
        options: [preview, development]
        default: preview
      api_url:
        description: HTTPS URL of the staging API the test app talks to
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: build-test-app
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PLATFORM: ${{ inputs.platform }}
      PROFILE: ${{ inputs.profile }}
      API_URL: ${{ inputs.api_url }}
    steps:
      - name: Check inputs and secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN repository secret first (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if ! printf '%s' "$API_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$'; then
            echo "::error::api_url must be an https:// URL"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Point the build profile at the staging API
        working-directory: apps/mobile
        run: |
          jq --arg p "$PROFILE" --arg u "${API_URL%/}" '.build[$p].env.EXPO_PUBLIC_API_URL = $u' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json
          jq --arg p "$PROFILE" '.build[$p]' eas.json
      - name: Link the EAS project (first run creates it)
        working-directory: apps/mobile
        run: |
          if ! jq -e '.expo.extra.eas.projectId' app.json > /dev/null; then
            eas init --non-interactive --force
          fi
      - name: Start EAS build
        working-directory: apps/mobile
        run: eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait
      - name: Where to find it
        run: echo "Builds are queued on expo.dev → Projects → edgevitals → Builds. Each finished build has an install link and QR code."
