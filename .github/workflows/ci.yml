name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgevitals
          POSTGRES_PASSWORD: edgevitals
          POSTGRES_DB: edgevitals_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edgevitals" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://edgevitals:edgevitals@localhost:5432/edgevitals_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  # Dependency and secret scanning (docs 14 section 3, step 6).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Runtime dependencies only; fails on high or critical advisories.
      # Moderate findings are reviewed in docs/security-accessibility-review.md.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      # Free for personal accounts. An organization-owned copy of the repository
      # needs a GITLEAKS_LICENSE secret (gitleaks.io).
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds both production images and smoke-tests the API image against Postgres.
  images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgevitals
          POSTGRES_PASSWORD: edgevitals
          POSTGRES_DB: edgevitals_images
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edgevitals" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t edgevitals-api .
      - name: Build web image
        run: docker build -f apps/mobile/Dockerfile.web --build-arg EXPO_PUBLIC_API_URL=https://api.example.invalid -t edgevitals-web .
      - name: Migrate and probe the API image
        env:
          DATABASE_URL: postgres://edgevitals:edgevitals@127.0.0.1:5432/edgevitals_images
        run: |
          docker run --rm --network host -e DATABASE_URL edgevitals-api node dist/migrate.js
          docker run -d --name api --network host -e DATABASE_URL \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e HOSTING_REGION=ci \
            -e CORS_ORIGINS=https://app.example.invalid -e MIGRATE_ON_START=false edgevitals-api
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4000/ready && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Probe the web image headers
        run: |
          docker run -d --name web -p 8080:8080 -e API_ORIGIN=https://api.example.invalid edgevitals-web
          sleep 2
          curl -fsSI http://127.0.0.1:8080/ | tee headers.txt
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          curl -fsSI http://127.0.0.1:8080/mediapipe/loader.mjs | grep -qi "content-type: text/javascript"

  # Web end-to-end tests: exported web build + API + Postgres, under the production CSP.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgevitals
          POSTGRES_PASSWORD: edgevitals
          POSTGRES_DB: edgevitals_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edgevitals" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://edgevitals:edgevitals@localhost:5432/edgevitals_e2e
      E2E_DATABASE_URL: postgres://edgevitals:edgevitals@localhost:5432/edgevitals_e2e
      EXPO_PUBLIC_API_URL: http://localhost:4000
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - run: npm run build:web
        working-directory: apps/mobile
      - name: Start API (demo mode, CI only) and static server
        run: |
          (cd apps/api && JWT_SECRET="$(openssl rand -hex 32)" CORS_ORIGINS=http://localhost:8081 \
            DEMO_MODE_ENABLED=true AUTH_RATE_LIMIT_PER_MIN=1000 npx tsx src/server.ts > ../../api.log 2>&1 &)
          (cd apps/mobile && node e2e/serve.mjs dist 8081 > ../../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/ready && curl -fsS -o /dev/null http://localhost:8081/ && exit 0; sleep 1; done
          cat api.log web.log; exit 1
      - run: npm run e2e
        working-directory: apps/mobile
      - if: failure()
        run: cat api.log web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/mobile/test-results
          retention-days: 7
